# CI de los proyectos de predicción y evaluación del modelo de ventas y del RAG.
# Ejecuta los tests de tests/pipelines/ del split 8/2, de la validación
# cruzada temporal (orden cronológico de los folds y ausencia de fuga) y del
# RAG (retrieve/query con mocks; sin Qdrant ni LLM en vivo), y del agente
# LangGraph: grafo con dobles del RAG, tools con transporte HTTP simulado,
# enrutador y evals sobre los traces grabados; y del servidor MCP con OAuth
# (MCP Auth con un verificador de token simulado).
name: sales-model-tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pipelines-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv y Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias (uv.lock)
        run: uv sync --frozen

      - name: Tests del modelo de ventas
        run: >-
          uv run pytest -q
          tests/pipelines/test_sales_forecast_split.py
          tests/pipelines/test_sales_model_eval.py
          tests/pipelines/test_rag.py
          tests/pipelines/test_agent_graph.py
          tests/pipelines/test_agent_tools.py
          tests/pipelines/test_agent_routing.py
          tests/pipelines/test_agent_evals.py
          tests/pipelines/test_agent_memory_policy.py
          tests/pipelines/test_agent_memory_store.py
          tests/pipelines/test_agent_memory_decision.py
          tests/pipelines/test_agent_memory_graph.py
          tests/mcps/test_trackflow_mcp.py
