services:
  ui:
    build:
      context: ./uis
    depends_on:
      - api
    ports:
      - "3000:3000"
      - "3001:3001"
      - "3002:3002"
    volumes:
      - ./uis:/app
      - ./src:/src
      - ui_website_node_modules:/app/website/node_modules
      - ui_backoffice_node_modules:/app/backoffice/node_modules
      - ui_application_node_modules:/app/application/node_modules
    env_file:
      - path: ./.env
        required: false
    environment:
      NEXT_PUBLIC_INVENTORY_API_URL: ${NEXT_PUBLIC_INVENTORY_API_URL:-http://api:8000}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://api:8000}
    networks:
      - trackflow-network

  api:
    build:
      context: ./services
    ports:
      - "8000:8000"
    volumes:
      - ./services:/app
      - ./packages:/app/packages
      # El Pipeline de Desempeño de Negocio vive en data/pipelines/ y lo importa services/reporting/.
      - ./data:/app/data
    env_file:
      - path: ./.env
        required: false
    environment:
      # Dentro de la red de Docker, Redis es el servicio `redis` (no localhost).
      REDIS_URL: redis://redis:6379/0
      # Base vectorial del RAG (Hito 7): servicio `qdrant` dentro de la red.
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - redis
      - qdrant
    networks:
      - trackflow-network

  # Base de datos vectorial del asistente comercial RAG (Hito 7).
  # Colección `trackflow_knowledge`; los vectores persisten en el volumen qdrant_data.
  # Panel web (solo desarrollo): http://localhost:6333/dashboard
  qdrant:
    # Misma versión menor que qdrant-client (1.20) para evitar el aviso de compatibilidad.
    image: qdrant/qdrant:v1.20.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - trackflow-network

  # Broker y result backend de Celery (Ticket #DEV-55).
  # noeviction: si se llena la memoria, Redis rechaza escrituras en lugar de borrar
  # mensajes de la cola. appendonly: los mensajes sobreviven a un reinicio.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - trackflow-network

  # Monitor de la cola (solo desarrollo): http://localhost:5555
  flower:
    image: mher/flower:2.0
    command: ["celery", "--broker=redis://redis:6379/0", "flower", "--port=5555"]
    ports:
      - "5555:5555"
    depends_on:
      - redis
    networks:
      - trackflow-network

  # Worker de Celery: proceso separado de la API, con la misma imagen y código.
  # En el Codespace se arranca como proceso local (README); este servicio es la
  # forma de desplegarlo en contenedor: `docker compose up -d worker`.
  worker:
    build:
      context: ./services
    command: ["celery", "-A", "celery_app", "worker", "-l", "info", "--concurrency=2"]
    volumes:
      - ./services:/app
      - ./packages:/app/packages
      - ./data:/app/data
    env_file:
      - path: ./.env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - trackflow-network

networks:
  trackflow-network:
    name: trackflow-network

volumes:
  redis_data:
  qdrant_data:
  ui_website_node_modules:
  ui_backoffice_node_modules:
  ui_application_node_modules: