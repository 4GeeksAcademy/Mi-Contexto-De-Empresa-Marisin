[project]
name = "mi-contexto-de-empresa-marisin"
version = "0.1.0"
description = "TrackFlow Supplier Directory API"
dependencies = [
    "fastapi",
    "uvicorn",
    "tinydb",
    "pydantic",
    "python-jose[cryptography]>=3.5.0",
    "libpass[bcrypt]>=1.9.3",
    "python-dotenv>=1.2.3",
    "sqlmodel>=0.0.24,<0.1",
    "psycopg2-binary>=2.9.10,<3",
    "pandas",
    "prefect>=3",
    "celery>=5.7.0",
    "redis>=8.1.0",
    "flower>=2.2.0",
    "scikit-learn>=1.9.1",
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
