[project]
name = "mi-contexto-de-empresa-marisin"
version = "0.1.0"
description = "TrackFlow Supplier Directory API"
dependencies = [
    "fastapi",
    "uvicorn",
    "tinydb",
    "pydantic",
    "python-jose[cryptography]>=3.5.0",
    "libpass[bcrypt]>=1.9.3",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
