# TrackFlow · endurecimiento de SSH (D4).
# Se instala en /etc/ssh/sshd_config.d/. Ubuntu 24.04 incluye sshd_config.d/*.conf al
# principio de sshd_config y en sshd gana el primer valor leído: este drop-in manda sobre
# el fichero principal. Comprobación: `sshd -T` (configuración efectiva).

# Nadie entra como root: se entra como trackflow-ops y se eleva con sudo (con contraseña).
PermitRootLogin no

# Solo clave pública: sin contraseñas ni teclado interactivo.
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey

# Solo el usuario de operaciones (la cuenta de servicio trackflow no tiene login).
AllowUsers trackflow-ops

# Menos margen para la fuerza bruta (ufw limita además 22/tcp).
MaxAuthTries 3
LoginGraceTime 30

# Sin túneles ni X11: SSH es solo para operar el servidor.
X11Forwarding no
AllowTcpForwarding no

# Cierra las sesiones inactivas (2 × 300 s sin respuesta).
ClientAliveInterval 300
ClientAliveCountMax 2
